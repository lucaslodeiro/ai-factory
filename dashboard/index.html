<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Factory</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div><p class="eyebrow">LOCAL CONTROL PLANE</p><h1>AI Factory</h1><p id="repository" class="muted">Loading configuration…</p></div>
    <div class="daemon"><span id="daemon-dot"></span><div><strong id="daemon-state">Checking daemon</strong><small id="daemon-pid"></small></div><button id="stop" class="danger">Stop daemon</button></div>
  </header>
  <main>
    <section class="metrics" aria-label="Summary">
      <article><span>Active</span><strong id="active-count">—</strong></article>
      <article><span>Waiting</span><strong id="waiting-count">—</strong></article>
      <article><span>Ready</span><strong id="ready-count">—</strong></article>
      <article><span>Failed</span><strong id="failed-count">—</strong></article>
    </section>
    <section class="panel"><div class="panel-title"><div><p class="eyebrow">WORK QUEUE</p><h2>Issues</h2></div><span id="updated" class="muted"></span></div><div id="items" class="items"></div></section>
    <div class="columns">
      <section class="panel"><div class="panel-title"><div><p class="eyebrow">AGENTS</p><h2>Recent executions</h2></div></div><div id="executions" class="timeline"></div></section>
      <section class="panel"><div class="panel-title"><div><p class="eyebrow">AUDIT</p><h2>Recent events</h2></div></div><div id="events" class="timeline"></div></section>
    </div>
  </main>
  <div id="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
