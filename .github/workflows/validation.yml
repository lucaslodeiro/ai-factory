name: Product validation
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  validation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:all
